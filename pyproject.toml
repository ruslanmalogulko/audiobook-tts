[project]
name = "audiobook-tts"
version = "0.1.0"
description = "Local EPUB to audiobook (m4b + video with subtitles) for Russian books: Silero TTS + RUAccent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "f5-tts>=1.1.22",
    "lxml>=6.1.3",
    "num2words>=0.5.14",
    "numpy>=2.5.3",
    "omegaconf>=2.3.1",
    "pillow>=12.3.0",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "ruaccent>=1.5.8.3",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "transformers>=4.40,<5",
]
